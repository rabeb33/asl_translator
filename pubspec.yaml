name: asl_translator
description: ASL Sign Language Real-Time Translator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Caméra
  camera: ^0.10.5+9

  # TFLite - classification
  tflite_flutter: ^0.12.1

  

  # Traitement image
  image: ^4.1.7
  flutter_image_compress: ^2.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  percent_indicator: ^4.2.3

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  collection: ^1.18.0
  provider: ^6.1.2
  hand_detection: ^3.0.3
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/

  
